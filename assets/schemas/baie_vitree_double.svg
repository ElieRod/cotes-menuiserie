<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Cadre extérieur -->
  <rect x="50" y="50" width="400" height="200" fill="none" stroke="#333" stroke-width="3"/>
  
  <!-- Triangles aux 4 coins -->
  <polygon points="50,50 80,50 50,80" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  <polygon points="450,50 420,50 450,80" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  <polygon points="50,250 50,220 80,250" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  <polygon points="450,250 450,220 420,250" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Verre gauche -->
  <rect x="80" y="80" width="160" height="170" fill="#E8F4F8" stroke="#0066cc" stroke-width="2"/>
  <!-- Verre droit -->
  <rect x="260" y="80" width="160" height="170" fill="#E8F4F8" stroke="#0066cc" stroke-width="2"/>
  
  <!-- Montant central -->
  <line x1="250" y1="80" x2="250" y2="250" stroke="#333" stroke-width="3"/>
  
  <!-- Croisillons horizontaux -->
  <line x1="80" y1="165" x2="420" y2="165" stroke="#333" stroke-width="2"/>
  
  <!-- Dimensions -->
  <text x="250" y="280" text-anchor="middle" font-size="14" fill="#333">Baie Vitrée Double</text>
</svg>