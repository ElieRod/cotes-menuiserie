<svg viewBox="0 0 300 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Cadre extérieur -->
  <rect x="50" y="50" width="200" height="400" fill="none" stroke="#333" stroke-width="3"/>
  
  <!-- Triangles aux 4 coins -->
  <polygon points="50,50 80,50 50,80" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  <polygon points="250,50 220,50 250,80" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  <polygon points="50,450 50,420 80,450" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  <polygon points="250,450 250,420 220,450" fill="#FF8C00" stroke="#FF8C00" stroke-width="2"/>
  
  <!-- Verre gauche -->
  <rect x="80" y="80" width="65" height="340" fill="#E8F4F8" stroke="#0066cc" stroke-width="2"/>
  <!-- Verre droit -->
  <rect x="155" y="80" width="65" height="340" fill="#E8F4F8" stroke="#0066cc" stroke-width="2"/>
  
  <!-- Montant central -->
  <line x1="150" y1="80" x2="150" y2="420" stroke="#333" stroke-width="3"/>
  
  <!-- Croisillons horizontaux -->
  <line x1="80" y1="250" x2="220" y2="250" stroke="#333" stroke-width="2"/>
  
  <!-- Poignées -->
  <circle cx="120" cy="250" r="5" fill="#666"/>
  <circle cx="180" cy="250" r="5" fill="#666"/>
  
  <!-- Dimensions -->
  <text x="150" y="480" text-anchor="middle" font-size="14" fill="#333">Porte Double</text>
</svg>