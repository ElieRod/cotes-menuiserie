<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotations Menuiserie</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Générateur de Cotations Menuiserie</h1>
            <p>Créez vos devis de menuiserie facilement</p>
        </header>

        <main>
            <section class="form-section">
                <h2>Informations du Devis</h2>
                <form id="quoteForm">
                    <!-- Référence -->
                    <div class="form-group">
                        <label for="reference">Référence Devis:</label>
                        <input type="text" id="reference" name="reference" placeholder="Ex: DEV-2024-001" required>
                    </div>

                    <!-- Client -->
                    <div class="form-group">
                        <label for="client">Client:</label>
                        <input type="text" id="client" name="client" placeholder="Nom du client" required>
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label for="date">Date:</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <!-- Menuiseries -->
                    <h3>Menuiseries</h3>
                    <div id="menuiseriesContainer"></div>
                    <button type="button" id="addMenuiserie" class="btn-add">+ Ajouter une menuiserie</button>

                    <!-- Bouton Générer PDF -->
                    <button type="submit" id="generatePdf" class="btn-submit">Générer Rapport PDF</button>
                </form>
            </section>
        </main>
    </div>

    <!-- Modal pour Menuiserie -->
    <div id="menuiserieModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Ajouter une Menuiserie</h2>
            <form id="menuiserieForm">
                <div class="form-group">
                    <label for="menuisery">Type:</label>
                    <select id="menuisery" name="menuisery">
                        <option value="porte">Porte</option>
                        <option value="fenetre">Fenêtre</option>
                        <option value="baie">Baie vitrée</option>
                        <option value="volet">Volet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="pose">Type de pose:</label>
                    <select id="pose" name="pose">
                        <option value="applique">Applique</option>
                        <option value="encastree">Encastrée</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="width">Largeur (mm):</label>
                    <input type="number" id="width" name="width" placeholder="500" min="100" required>
                </div>

                <div class="form-group">
                    <label for="height">Hauteur (mm):</label>
                    <input type="number" id="height" name="height" placeholder="1000" min="100" required>
                </div>

                <div class="form-group">
                    <label for="material">Matériau:</label>
                    <select id="material" name="material">
                        <option value="bois">Bois</option>
                        <option value="alu">Aluminium</option>
                        <option value="pvc">PVC</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="glazing">Vitrage:</label>
                    <select id="glazing" name="glazing">
                        <option value="simple">Simple</option>
                        <option value="double">Double</option>
                        <option value="triple">Triple</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Ajouter</button>
            </form>
        </div>
    </div>

    <!-- Rapport PDF -->
    <div id="report" class="report" style="display:none;">
        <div id="reportContent">
            <h1>Devis Menuiserie</h1>
            <p><strong>Référence:</strong> <span id="reportReference">-</span></p>
            <p><strong>Client:</strong> <span id="reportClient">-</span></p>
            <p><strong>Date:</strong> <span id="reportDate">-</span></p>
            <h2>Détails des menuiseries</h2>
            <div id="reportMenuiseries"></div>
        </div>
    </div>

    <script src="schemas.js"></script>
    <script src="app.js"></script>
    <script src="script.js"></script>
</body>
</html>
