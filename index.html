<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotes Menuiserie - Générateur de Rapports</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📐 Générateur de Cotes Menuiserie</h1>
            <p>Créer des rapports professionnels de menuiseries avec schémas 2D</p>
        </header>

        <main>
            <div class="form-section">
                <h2>📋 Informations du Chantier</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="clientName">Nom du Client :</label>
                        <input type="text" id="clientName" placeholder="Ex: Mr. De Carrion" value="Mr. De Carrion">
                    </div>

                    <div class="form-group">
                        <label for="reference">Référence :</label>
                        <input type="text" id="reference" placeholder="Ex: REF DE CARRION">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="date">Date :</label>
                        <input type="date" id="date">
                    </div>

                    <div class="form-group">
                        <label for="bicoloration">Bicoloration PVC :</label>
                        <input type="text" id="bicoloration" placeholder="Ex: GRIS ANTHRACITE (7016) ext. / Blanc int.">
                    </div>
                </div>

                <hr>

                <h2>📌 Repères et Dimensions</h2>
                
                <div id="reperesToabs" class="reperes-container">
                    <!-- Les repères seront ajoutés dynamiquement -->
                </div>

                <button id="addRepereBtn" class="btn btn-secondary">+ Ajouter un Repère</button>

                <hr>

                <h2>⚙️ Actions</h2>
                <button id="previewBtn" class="btn btn-primary">👁️ Aperçu Schéma</button>
                <button id="generatePdfBtn" class="btn btn-success">📄 Générer PDF</button>
            </div>

            <div id="previewSection" class="preview-section" style="display:none;">
                <h2>Aperçu du Schéma</h2>
                <button id="closePreviewBtn" class="btn btn-secondary" style="margin-bottom: 15px;">✕ Fermer</button>
                <div id="schemaContainer"></div>
            </div>
        </main>
    </div>

    <!-- Bibliothèques pour PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
