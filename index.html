<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotation Menuiseries - Applique/Tunnel/Feuillure/Rénovation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Cotation Menuiseries</h1>
            <p>Applique • Tunnel • Feuillure • Rénovation</p>
        </header>

        <form id="cotationForm">
            <!-- Section Client -->
            <fieldset>
                <legend>📋 Client & Références</legend>
                <div class="form-group">
                    <label for="client">Nom du client</label>
                    <input type="text" id="client" name="client" required>
                </div>
                <div class="form-group">
                    <label for="reference">Référence chantier</label>
                    <input type="text" id="reference" name="reference" required>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>
            </fieldset>

            <!-- Section Menuiseries -->
            <fieldset>
                <legend>🪟 Menuiseries</legend>
                <div id="menuiseriesContainer"></div>
                <button type="button" id="addMenuiserie" class="btn-secondary">+ Ajouter une menuiserie</button>
            </fieldset>

            <!-- Boutons Actions -->
            <div class="button-group">
                <button type="button" id="generatePdf" class="btn-primary">📄 Générer PDF</button>
                <button type="reset" class="btn-secondary">🔄 Réinitialiser</button>
            </div>
        </form>
    </div>

    <script src="schemas.js"></script>
    <script src="app.js"></script>
</body>
</html>
